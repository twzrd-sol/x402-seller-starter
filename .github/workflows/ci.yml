name: CI

on:
  push:
    branches: [main]
  pull_request:

# Hermetic only. Live facilitator paths (npm run smoke / smoke:contrast) stay manual.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
